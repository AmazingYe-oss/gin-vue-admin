server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：压缩文本类资源，减少传输体积
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 静态资源强缓存：vite 产物文件名带 hash，内容变文件名才变，可放心缓存一年
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理（^~ 保证前缀匹配优先于正则，防止 /api/uploads/*.png
    # 被正则 location 劫持去本地找文件导致 404）
    #
    # 末尾带 "/" = 剥掉 /api 前缀：/api/base/captcha -> /base/captcha
    #
    # 【血泪教训 2026-09-01】proxy_pass 里一旦用变量（set $backend + $backend/），
    # "location 前缀替换"魔法会失效，上游收到错误路径，后端 404。
    # 变量写法是为"后端没起时 nginx 也能启动"，但 compose 有 depends_on
    # 保证启动顺序，直接写字面量即可，fail fast 反而清晰。
    location ^~ /api/ {
        proxy_pass http://server:8888/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退：找不到文件/目录时返回 index.html，交给 vue-router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}